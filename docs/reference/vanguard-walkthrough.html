<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vanguard Walkthrough</title>
<style>
:root{--p:#5B3FD9;--p1:#EEE9FF;--p2:#C9BEFF;--ph0:#3B82F6;--ph1:#22A06B;--ph2:#E8A33D;--red:#E5484D;--navy:#1A2340;--muted:#59617c;--line:#E4E2EC}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#0d1020;overflow:hidden}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;color:var(--navy);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#fff;overflow:hidden}

/* ---------- top bar ---------- */
#top{position:absolute;left:0;top:0;width:1920px;height:84px;display:flex;align-items:center;gap:34px;padding:0 34px;border-bottom:1px solid var(--line);background:#fff;z-index:5}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:24px;letter-spacing:.14em;color:var(--p)}
.brand svg{width:34px;height:34px;color:var(--p)}
#ribbon{display:flex;gap:4px}
.ph{height:48px;display:flex;align-items:center;gap:10px;padding:0 30px 0 34px;background:#F1F2F6;color:#6b7390;font-size:16px;white-space:nowrap;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%,16px 50%);transition:background .9s ease,color .9s ease}
.ph:first-child{clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%);border-radius:10px 0 0 10px;padding-left:22px}
.ph b{font-weight:700}
.ph span{font-size:15px;opacity:.85}
.ph.on{color:#fff}
.ph.on.p0{background:var(--ph0)}.ph.on.p1{background:var(--ph1)}.ph.on.p2{background:var(--ph2)}
#loop{margin-left:auto;display:flex;align-items:center;gap:8px}
#loop .lt{font-size:15px;color:var(--muted);font-weight:600;margin-right:6px;letter-spacing:.06em;text-transform:uppercase}
.lp{height:40px;display:flex;align-items:center;gap:8px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);font-size:16px;font-weight:600;color:#7a819a;transition:all .5s ease;background:#fff}
.lp.on{background:var(--p);color:#fff;border-color:var(--p);box-shadow:0 0 0 5px var(--p1)}
.lp.done{color:var(--p);border-color:var(--p2);background:var(--p1)}
.lp svg{width:16px;height:16px}
.arr{color:#b5b9c9;font-size:18px}
.lp.safety{display:none}
.lp.safety.show{display:flex}

/* ---------- main ---------- */
#main{position:absolute;left:0;top:84px;width:1920px;height:900px}
#world{position:absolute;left:0;top:0;width:1114px;height:900px;overflow:hidden;background:#e9d3b0}
#world canvas{position:absolute;left:0;top:0;width:1114px!important;height:900px!important;display:block}
#overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#sceneTag{position:absolute;left:22px;top:20px;display:flex;align-items:center;gap:12px;background:rgba(26,35,64,.78);color:#fff;border-radius:12px;padding:9px 16px 9px 10px;font-size:17px;font-weight:600;letter-spacing:.04em;backdrop-filter:blur(6px)}
#sceneTag b{background:#fff;color:var(--navy);border-radius:8px;padding:3px 9px;font-size:16px}
#fade{position:absolute;inset:0;background:#0d1020;opacity:0;pointer-events:none;transition:opacity .55s ease}
#splitLine{position:absolute;left:556px;top:0;width:4px;height:900px;background:#fff;box-shadow:0 0 18px rgba(0,0,0,.35);opacity:0;transition:opacity .5s}
#splitLine.on{opacity:1}
#devicePanel{position:absolute;left:1114px;top:0;width:806px;height:900px;overflow:hidden;border-left:1px solid var(--line);
 background:radial-gradient(circle at 1px 1px,rgba(91,63,217,.10) 1.2px,transparent 1.3px) 0 0/26px 26px,linear-gradient(160deg,#F8F7FD,#EEEBF8)}

/* ---------- bottom bar ---------- */
#bottom{position:absolute;left:0;top:984px;width:1920px;height:96px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 30px 0 34px;z-index:5}
#prog{position:absolute;left:0;top:-1px;height:4px;width:0;background:var(--p)}
#caption{flex:1;font-size:26px;white-space:nowrap;overflow:hidden;font-weight:500;line-height:1.25;color:var(--navy);min-width:0;transition:opacity .4s}
#caption.hide{opacity:0}
.ctl{display:flex;align-items:center;gap:10px;transition:opacity .3s}
.ctl.hidden{opacity:0;pointer-events:none}
.btn{height:46px;min-width:46px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 15px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font:600 16px/1 inherit;font-family:inherit;color:var(--navy);cursor:pointer}
.btn:hover{border-color:var(--p2)}
.btn.primary{background:var(--p);color:#fff;border-color:var(--p);min-width:120px}
.btn svg{width:18px;height:18px}
#counter{font-size:18px;font-weight:700;min-width:74px;text-align:center;font-variant-numeric:tabular-nums}
#skip{height:46px;border-radius:12px;border:1.5px solid var(--line);font:500 16px inherit;font-family:inherit;color:var(--navy);padding:0 10px;background:#fff;max-width:215px}

/* ---------- banner ---------- */
#banner{position:absolute;left:50%;top:150px;transform:translate(-50%,-40px);opacity:0;background:#fff;border-radius:20px;padding:26px 44px 26px 36px;display:flex;align-items:center;gap:22px;box-shadow:0 24px 60px rgba(26,35,64,.28);z-index:8;transition:opacity .6s,transform .7s cubic-bezier(.2,.9,.3,1);border-left:8px solid var(--p);pointer-events:none}
#banner.on{opacity:1;transform:translate(-50%,0)}
#banner .bk{white-space:nowrap;font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;padding:7px 14px;border-radius:999px;background:var(--ph1);transition:background .6s}
#banner .bt{font-size:34px;font-weight:700;color:var(--navy);white-space:nowrap}
#banner .bt em{font-style:normal;color:var(--p)}

/* ---------- 3D overlay items ---------- */
.ol{position:absolute;left:0;top:0;will-change:transform}
.lbl{position:absolute;transform:translate(-50%,-100%) translateY(6px);opacity:0;transition:opacity .5s,transform .5s;background:rgba(255,255,255,.95);color:var(--navy);font-size:16px;font-weight:700;padding:6px 12px;border-radius:10px;white-space:nowrap;box-shadow:0 4px 14px rgba(26,35,64,.2)}
.lbl small{font-size:14px;font-weight:500;color:var(--muted);margin-left:6px}
.lbl.on{opacity:1;transform:translate(-50%,-100%)}
.lbl.place{background:rgba(26,35,64,.82);color:#fff;font-weight:600;font-size:15px}
.lbl.place.vg{background:var(--p)}
.chk{position:absolute;width:44px;height:44px;border-radius:50%;background:var(--p);display:grid;place-items:center;transform:translate(-50%,-50%) scale(0);transition:transform .55s cubic-bezier(.3,1.7,.5,1);box-shadow:0 0 0 7px rgba(91,63,217,.28),0 6px 16px rgba(0,0,0,.25)}
.chk.on{transform:translate(-50%,-50%) scale(1)}
.chk svg{width:24px;height:24px;color:#fff}
.pin{position:absolute;transform:translate(-50%,-100%) scale(0);transform-origin:50% 100%;transition:transform .5s cubic-bezier(.3,1.6,.5,1),opacity .4s;display:flex;flex-direction:column;align-items:center}
.pin.on{transform:translate(-50%,-100%) scale(1)}
.pin.fade{opacity:0}
.pin .hd{width:50px;height:50px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--p);display:grid;place-items:center;box-shadow:0 6px 16px rgba(26,35,64,.3);border:3px solid #fff}
.pin .hd svg{transform:rotate(45deg);width:24px;height:24px;color:#fff}
.pin .ptg{margin-top:8px;background:#fff;color:var(--p);font-size:15px;font-weight:700;padding:4px 10px;border-radius:8px;box-shadow:0 3px 10px rgba(26,35,64,.2);white-space:nowrap}
.pin.big .hd{width:74px;height:74px}
.pin.big .hd svg{width:34px;height:34px}
.pin.big .ptg{font-size:18px;padding:7px 14px;background:var(--p);color:#fff}
.pin.red .hd{background:var(--red)}
.pin.red .ptg{color:var(--red)}
.pin.water .hd{background:#2E9BD6}
.pin.water .ptg{color:#1f78a8}
.say{position:absolute;transform:translate(-50%,-100%) scale(.4);opacity:0;transform-origin:50% 100%;transition:all .45s cubic-bezier(.3,1.6,.5,1);background:#fff;border-radius:14px;padding:8px 14px;font-size:22px;font-weight:800;color:var(--p);box-shadow:0 6px 16px rgba(26,35,64,.25);white-space:nowrap}
.say::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.say.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
.say.msg{font-size:16px;font-weight:600;color:var(--navy);width:300px;white-space:normal;line-height:1.35;border-left:5px solid var(--p)}
.tok{position:absolute;transform:translate(-50%,-100%);background:var(--p);color:#fff;font-size:15px;font-weight:800;padding:3px 9px;border-radius:8px;box-shadow:0 3px 10px rgba(26,35,64,.25);opacity:0;transition:opacity .4s}
.tok.on{opacity:1}
.buzz{position:absolute;transform:translate(-50%,-50%);opacity:0;transition:opacity .3s;color:#fff}
.buzz.on{opacity:1}
.buzz svg{width:64px;height:40px;animation:buzz .18s infinite alternate}
@keyframes buzz{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
.sound{position:absolute;transform:translate(-50%,-50%);opacity:0;transition:opacity .4s}
.sound.on{opacity:1}
.sound svg{width:46px;height:46px;color:#fff;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.sound .w{animation:wv 1s infinite}
@keyframes wv{0%,100%{opacity:.3}50%{opacity:1}}

/* ---------- device slot ---------- */
.slot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .55s ease,transform .6s cubic-bezier(.2,.8,.3,1)}
.slot.enter{opacity:0;transform:translateY(34px)}
.slot.leave{opacity:0;transform:translateY(-34px)}
.owner{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 15px 7px 10px;font-size:16px;font-weight:600;box-shadow:0 2px 8px rgba(26,35,64,.06)}
.owner svg{width:20px;height:20px;color:var(--p)}
.row{display:flex;align-items:center;gap:28px}
.col{display:flex;flex-direction:column;align-items:center;gap:12px}
.lock{display:flex;align-items:center;gap:10px;background:var(--p1);border:1.5px solid var(--p2);color:var(--navy);border-radius:12px;padding:10px 16px;font-size:16px;font-weight:500;opacity:0;transform:translateY(10px);transition:all .5s ease;min-height:46px}
.lock.on{opacity:1;transform:none}
.lock svg{width:20px;height:20px;color:var(--p);flex:none}
.lock.ghost{visibility:hidden}

/* feature phone */
.fp{width:330px;height:752px;border-radius:52px 52px 70px 70px;background:linear-gradient(165deg,#41475a 0%,#23262f 45%,#191b22 100%);padding:24px 22px;box-shadow:0 30px 60px rgba(26,35,64,.35),inset 0 2px 0 rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;position:relative;flex:none}
.fp.ring{animation:ring .12s infinite alternate}
@keyframes ring{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
.fp .spk{width:70px;height:6px;border-radius:3px;background:#0d0f14;margin:4px 0 14px}
.fp .scr{width:286px;height:338px;background:#fbfbfd;border-radius:10px;border:6px solid #0b0c10;overflow:hidden;position:relative;display:flex;flex-direction:column;flex:none}
.fp .sbar{height:30px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 10px;background:#ECEEF4;font-size:14px;font-weight:600}
.fp .sbar svg{width:20px;height:14px}
.fp .body{flex:1;position:relative;overflow:hidden}
.fsw{position:absolute;inset:0;padding:10px 12px;font-size:17px;line-height:1.32;animation:fsin .3s both;display:flex;flex-direction:column}
@keyframes fsin{from{opacity:0}to{opacity:1}}
.fp .soft{height:32px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 12px;background:#ECEEF4;font-size:15px;font-weight:700}
.fp .nav{width:100%;display:flex;align-items:center;justify-content:space-between;margin:14px 0 12px;padding:0 4px}
.ck{width:66px;height:42px;border-radius:14px;background:#2d313c;display:grid;place-items:center;color:#e8eaf0;transition:all .12s;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.ck svg{width:22px;height:22px}
.ck.end svg{transform:rotate(135deg)}
.dpad{width:86px;height:86px;border-radius:50%;background:#2d313c;display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.dpad i{width:38px;height:38px;border-radius:50%;background:#3d4250}
.kp{display:grid;grid-template-columns:repeat(3,86px);gap:10px 12px}
.k{height:56px;border-radius:14px 14px 20px 20px;background:#2d313c;color:#f2f3f7;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all .12s;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.k b{font-size:23px;font-weight:600;line-height:1}
.k s{text-decoration:none;font-size:14px;color:#a9afc1;line-height:1.15;letter-spacing:.08em;text-transform:uppercase}
.k.pr,.ck.pr{background:#E9E5FA;color:var(--navy);transform:scale(.93);box-shadow:0 0 0 4px rgba(201,190,255,.6)}
.k.pr s{color:var(--muted)}
.fs-t{font-size:15px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.fs-big{font-size:30px;font-weight:600;letter-spacing:.03em;word-break:break-all}
.fs-c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.fs-c svg{width:46px;height:46px;color:var(--p)}
.fs-ring svg{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.fs-menu div{padding:3px 6px;border-radius:6px;transition:all .2s}
.fs-menu div.sel{background:var(--p);color:#fff}
.fs-in{margin-top:auto;border:2px solid #cfd2dc;border-radius:6px;padding:4px 8px;font-size:17px;min-height:34px}
.fs-from{font-weight:800;color:var(--p);font-size:15px;letter-spacing:.06em;margin-bottom:4px}
.fs-sms{font-size:16px;line-height:1.34}
.fs-sms .ft{display:block;margin-top:6px;font-weight:600;color:var(--p)}
.fs-home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.fs-home .tm{font-size:46px;font-weight:300}
.fs-home .dt{font-size:15px;color:var(--muted)}
.fs-home .bal{margin-top:16px;font-size:15px;background:#F1F2F6;border-radius:8px;padding:5px 10px;font-weight:600}
.caret{display:inline-block;width:2px;height:1em;background:var(--p);vertical-align:-2px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* side card */
.side{width:372px;background:#fff;border-radius:22px;box-shadow:0 16px 40px rgba(26,35,64,.14);padding:18px;display:flex;flex-direction:column;gap:10px;min-height:120px;flex:none}
.side h4{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:8px}
.side h4 svg{width:18px;height:18px;color:var(--p)}
.tl{font-size:17px;line-height:1.35;padding:10px 13px;border-radius:12px;background:var(--p1);animation:rise .45s both}
.tl .who{display:block;font-size:14px;font-weight:700;color:var(--p);letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.tl.u{background:#F1F2F6}
.tl.u .who{color:var(--muted)}
.tl.key{align-self:flex-end;background:#fff;border:1.5px solid var(--line);font-weight:600;padding:6px 12px}
.wave{display:flex;align-items:center;gap:3px;height:22px;margin-top:4px}
.wave i{width:4px;border-radius:2px;background:var(--muted);animation:wave .9s infinite ease-in-out}
.wave.p i{background:var(--p)}
@keyframes wave{0%,100%{height:5px}50%{height:20px}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* smartphone */
.sp{width:380px;height:760px;border-radius:56px;background:#15171e;padding:12px;box-shadow:0 30px 60px rgba(26,35,64,.35),inset 0 0 0 2px #2c2f3a;position:relative;flex:none}
.sp.narrow{width:356px}
.sp.shake{animation:ring .1s 6 alternate}
.sp::before{content:"";position:absolute;right:-4px;top:150px;width:4px;height:70px;border-radius:0 3px 3px 0;background:#2c2f3a}
.sp .in{width:100%;height:100%;border-radius:45px;overflow:hidden;background:#fff;position:relative;display:flex;flex-direction:column}
.sp .isl{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:#000;z-index:4;box-shadow:inset 0 0 0 4px #1b1d26}
.sp .sbar{height:50px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 6px 34px;font-size:15px;font-weight:700;position:relative;z-index:3}
.sp .sbar .sic{display:flex;align-items:center;gap:6px}
.sp .sbar svg{width:18px;height:14px}
.nd{font-style:normal;font-size:14px;font-weight:700;color:var(--red)}
.sp .app{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.sp .home{position:absolute;bottom:8px;left:50%;width:124px;height:5px;border-radius:3px;background:var(--navy);opacity:.75;transform:translateX(-50%);z-index:5}
.sp.dark .in{background:#0f1220;color:#fff}
.sp.dark .home{background:#fff}

/* vanguard app */
.vh{background:linear-gradient(135deg,#5B3FD9,#7458ee);color:#fff;padding:12px 20px 16px;margin-top:-50px;padding-top:62px;flex:none}
.vt{display:flex;align-items:center;gap:9px;font-size:20px}
.vt svg{width:26px;height:26px}
.vtag{margin-left:auto;font-size:14px;font-weight:700;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:999px}
.vs{font-size:15px;opacity:.92;margin-top:5px}
.vb{flex:1;background:#F6F5FB;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:hidden;min-height:0}
.card{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 2px 10px rgba(26,35,64,.08);font-size:16px;line-height:1.38;animation:rise .45s both;position:relative}
.card h5{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.card .m{color:var(--muted);font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--p);box-shadow:0 0 0 4px var(--p1);animation:pulse 1s infinite;flex:none}
.bt2{display:flex;gap:10px;margin-top:12px}
.bP,.bS{flex:1;border-radius:14px;padding:12px;text-align:center;font-weight:700;font-size:17px;position:relative;overflow:hidden;transition:transform .15s}
.bP{background:var(--p);color:#fff}
.bS{background:#F1F2F6;color:var(--navy)}
.bP.pr,.bS.pr,.opt.pr{transform:scale(.96)}
.step{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:11px 14px;font-size:16px;font-weight:600;animation:rise .45s both;box-shadow:0 2px 8px rgba(26,35,64,.06)}
.step .ic{width:32px;height:32px;border-radius:50%;background:var(--p1);display:grid;place-items:center;color:var(--p);flex:none}
.step .ic svg{width:18px;height:18px}
.step.done .ic{background:var(--p);color:#fff}
.step .r{margin-left:auto}
.tg{width:48px;height:28px;border-radius:14px;background:#d6d8e0;position:relative;transition:background .3s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .3s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tg.on{background:var(--p)}
.tg.on::after{left:23px}
.code{display:flex;gap:8px;margin-top:8px}
.code span{width:50px;height:58px;border-radius:12px;background:var(--p1);color:var(--p);font-size:30px;font-weight:800;display:grid;place-items:center}
.prog{height:8px;border-radius:4px;background:#e6e3f3;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--p);width:0}
.amap{height:96px;border-radius:12px;margin-top:10px;position:relative;overflow:hidden;background:linear-gradient(90deg,transparent 46%,#ddd6c8 46%,#ddd6c8 54%,transparent 54%),linear-gradient(0deg,transparent 62%,#ddd6c8 62%,#ddd6c8 68%,transparent 68%),#EFEBE3}
.amap::after{content:"";position:absolute;left:52%;top:30%;width:84px;height:84px;margin:-42px;border-radius:50%;background:rgba(91,63,217,.25);border:2px dashed var(--p)}
.amap span{position:absolute;left:10px;bottom:8px;font-size:14px;font-weight:600;background:#fff;border-radius:6px;padding:2px 8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--p1);color:var(--p)}
.pill.g{background:#F1F2F6;color:var(--muted)}
.pill.rd{background:#FDECEC;color:var(--red)}

.who{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #f0eef6}
.who:last-child{border-bottom:0}
.av{width:38px;height:38px;border-radius:50%;background:#E8E6EF;display:grid;place-items:center;font-weight:700;font-size:16px;color:var(--navy);flex:none}
.av.p{background:var(--p);color:#fff}
.who .nm{font-weight:700;font-size:16px}

.note{background:var(--p1);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.38;display:flex;gap:8px;animation:rise .45s both}
.note svg{width:18px;height:18px;color:var(--p);flex:none;margin-top:2px}
.opt{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;font-size:16px;font-weight:600;animation:rise .4s both;transition:all .25s}
.opt b{width:30px;height:30px;border-radius:9px;background:#F1F2F6;display:grid;place-items:center;flex:none}
.opt.sel{background:var(--p);color:#fff;border-color:var(--p)}

.tapfx{position:absolute;width:60px;height:60px;border-radius:50%;background:rgba(26,35,64,.28);left:50%;top:50%;transform:translate(-50%,-50%) scale(.2);animation:tapfx .6s forwards;pointer-events:none;z-index:9}

.sent{display:flex;gap:6px;margin-top:10px}
.sent .av{width:34px;height:34px;font-size:14px;animation:rise .4s both;position:relative;display:block;line-height:34px;text-align:center}
.sent .av::after{content:"✓";position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border-radius:50%;background:var(--p);color:#fff;font-size:11px;display:grid;place-items:center;border:2px solid #fff}

/* dialer */
.dial{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 26px 30px}
.dial .num{font-size:40px;font-weight:300;height:56px;margin-top:20px;letter-spacing:.05em}
.dial .pad{display:grid;grid-template-columns:repeat(3,80px);gap:14px 26px;margin-top:auto}
.dk{width:80px;height:80px;border-radius:50%;background:#F1F2F6;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all .15s}
.dk b{font-size:30px;font-weight:400;line-height:1}
.dk s{text-decoration:none;font-size:14px;color:var(--muted);letter-spacing:.1em}
.dk.pr{background:#d9d6e8}
.dcall{width:80px;height:80px;border-radius:50%;background:var(--navy);display:grid;place-items:center;color:#fff;margin-top:18px;position:relative}
.dcall svg{width:32px;height:32px}
.calling{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
.calling .big{font-size:44px;font-weight:300}
.calling .st{font-size:18px;color:var(--muted)}
.fail{background:#FDECEC;color:var(--red);border-radius:16px;padding:16px 18px;font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px;animation:rise .4s both}
.fail svg{width:26px;height:26px}
.nodata{display:flex;align-items:center;gap:10px;background:#F1F2F6;border-radius:14px;padding:12px 16px;font-size:20px;font-weight:700;animation:rise .4s both}
.nodata svg{width:24px;height:24px;color:var(--red)}

/* chat app (generic) */
.chh{display:flex;align-items:center;gap:10px;padding:8px 14px 10px;background:#F3F4F6;border-bottom:1px solid #e3e5ea;flex:none}
.chh .bk svg{width:22px;height:22px;color:var(--navy)}
.chh .nm{font-weight:700;font-size:17px}
.chh .sb{font-size:14px;color:var(--muted)}

.b.i{background:#fff;align-self:flex-start;border-bottom-left-radius:4px}
.b.o{background:#DCE4F2;align-self:flex-end;border-bottom-right-radius:4px}

.b.sys{align-self:center;background:var(--p1);color:var(--p);font-size:15px;font-weight:700;border-radius:999px;padding:5px 12px}
.b .bn{display:block;font-size:14px;font-weight:700;color:var(--p);margin-bottom:2px}
.qr{display:flex;gap:6px;flex-wrap:wrap;align-self:flex-start;animation:bin .35s both}
.qr span{border:1.5px solid var(--p);color:var(--p);border-radius:999px;padding:6px 12px;font-size:15px;font-weight:700;background:#fff;position:relative;overflow:hidden;transition:all .25s}
.qr span.sel{background:var(--p);color:#fff}
.photo{width:190px;height:120px;border-radius:12px;background:linear-gradient(135deg,#b9c0cf,#8f97a8);display:grid;place-items:center;color:#fff;transition:all .5s}
.photo svg{width:40px;height:40px}
.photo.del{filter:blur(6px);opacity:.35}
.deltag{display:none;font-size:15px;font-weight:700;color:var(--red);margin-top:6px}
.deltag.on{display:block}
.typing{background:#fff;padding:12px 14px;border-radius:16px;align-self:flex-start;display:flex;gap:5px;animation:bin .3s both;flex:none}

@keyframes dot{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-4px);opacity:1}}
.cin{display:flex;align-items:center;gap:8px;padding:10px 12px 24px;background:#F3F4F6;flex:none}

.cin .ic svg{width:22px;height:22px}
.cin .fld{flex:1;background:#fff;border-radius:22px;padding:10px 14px;font-size:16px;min-height:44px;line-height:1.4}

.cin .snd svg{width:20px;height:20px}
.rcpt{background:#fff;border:1.5px dashed var(--p2);border-radius:12px;padding:8px 10px;margin-top:8px;font-size:14px;line-height:1.45;color:var(--muted)}

/* sms app */
.smh{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 10px;border-bottom:1px solid #eceef3;flex:none}

.smh .nm{font-weight:700;font-size:16px}

.sm{background:#EEF0F4;border-radius:18px;border-bottom-left-radius:5px;padding:10px 13px;font-size:16px;line-height:1.38;max-width:90%;align-self:flex-start;animation:bin .4s both;flex:none}

.rc{font-size:14px;font-weight:700;color:var(--muted);margin:4px 0 -2px 4px;animation:rise .4s both;display:flex;align-items:center;gap:6px}

/* alert */
.alertwrap{flex:1;background:linear-gradient(170deg,#2a2f55,#11142a);display:flex;flex-direction:column;padding:14px 14px 30px;margin-top:-50px;padding-top:64px}

.alrt{background:#fff;color:var(--navy);border-radius:22px;overflow:hidden;animation:alrt .6s cubic-bezier(.2,1.3,.4,1) both;box-shadow:0 20px 50px rgba(0,0,0,.4)}

.alrt .ah{background:var(--p);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.alrt .ah svg{width:22px;height:22px}
.alrt .at{padding:12px 16px 4px;font-size:20px;font-weight:800}
.ar{display:flex;gap:10px;padding:8px 16px;font-size:16px;line-height:1.35;animation:rise .4s both}
.ar svg{width:22px;height:22px;flex:none;color:var(--p);margin-top:1px}
.ar.scam svg,.ar.scam b{color:var(--red)}
.alrt .af{padding:10px 16px 14px;font-size:15px;font-weight:700;color:var(--p);border-top:1px solid #eee;margin-top:6px}

/* tablet */
.tb{width:784px;height:566px;border-radius:34px;background:#15171e;padding:16px;box-shadow:0 30px 60px rgba(26,35,64,.35),inset 0 0 0 2px #2c2f3a;flex:none}
.tb .in{width:100%;height:100%;border-radius:20px;overflow:hidden;display:flex;background:#F6F5FB}

.rail i.on{background:rgba(255,255,255,.12);color:#fff}
.rail i svg{width:22px;height:22px}
.dm{flex:1;padding:16px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.dh{display:flex;align-items:center;gap:10px}
.dh b{font-size:20px;color:var(--p)}
.dh span{font-size:16px;color:var(--muted);font-weight:600}
.dh .r{margin-left:auto;font-size:15px;color:var(--muted)}
.cols{display:flex;gap:14px;flex:1;min-height:0}
.inbox{width:270px;display:flex;flex-direction:column;gap:8px;flex:none}
.ib{background:#fff;border-radius:12px;padding:9px 11px;font-size:15px;line-height:1.35;display:flex;gap:9px;animation:rise .4s both;transition:all .6s ease;box-shadow:0 1px 4px rgba(26,35,64,.06)}
.ib .ci{width:30px;height:30px;border-radius:9px;background:var(--p1);color:var(--p);display:grid;place-items:center;flex:none}
.ib .ci svg{width:17px;height:17px}
.ib .ch{font-weight:800;font-size:14px;color:var(--p);letter-spacing:.05em;text-transform:uppercase}
.ib.dup{outline:2px dashed var(--p2)}
.ib.merged{animation:none;opacity:.5;transform:scale(.96)}
.case{flex:1;background:#fff;border-radius:16px;padding:16px 18px;box-shadow:0 4px 18px rgba(26,35,64,.1);display:flex;flex-direction:column;gap:10px;animation:rise .55s both;border-top:5px solid var(--p)}
.case h3{font-size:24px}
.case .ln{display:flex;align-items:center;gap:10px;font-size:17px;line-height:1.35;animation:rise .45s both}
.case .ln svg{width:20px;height:20px;color:var(--p);flex:none}
.case .ln.u svg{color:var(--red)}
.ph-empty{flex:1;border:2px dashed var(--line);border-radius:16px;display:grid;place-items:center;color:#9aa0b3;font-size:16px;font-weight:600}
.prow{background:#fff;border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:12px;font-size:16px;animation:rise .45s both;box-shadow:0 1px 4px rgba(26,35,64,.06);transition:all .4s}
.prow .n{width:30px;height:30px;border-radius:50%;background:#F1F2F6;display:grid;place-items:center;font-weight:800;flex:none}
.prow.hl{box-shadow:0 0 0 2.5px var(--p),0 6px 18px rgba(91,63,217,.18)}
.prow.hl .n{background:var(--p);color:#fff}
.prow .r{margin-left:auto;display:flex;gap:6px;flex:none}
.asg{background:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:16px;font-weight:600;animation:rise .45s both;border-left:5px solid var(--p)}
.asg .avs{display:flex}
.asg .avs .av{margin-left:-8px;border:2px solid #fff}
.tline{display:flex;gap:8px;flex-wrap:wrap;animation:rise .45s both}

/* outro */
.outro{position:absolute;inset:34px;border-radius:30px;background:linear-gradient(150deg,#5B3FD9,#3d27a8 70%,#2c1d83);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:40px;box-shadow:0 30px 70px rgba(45,29,131,.4)}
.outro .ob{display:flex;align-items:center;gap:16px;font-size:58px;font-weight:800;letter-spacing:.16em;animation:rise .8s both}
.outro .ob svg{width:64px;height:64px}
.outro svg.lpd{width:420px;height:420px;animation:rise .8s .3s both}
.outro .ln1{font-size:30px;font-weight:600;line-height:1.3;text-align:center;max-width:620px;opacity:0;transform:translateY(14px);transition:all .9s ease}
.outro .ln1.on{opacity:1;transform:none}
.lpd .nd circle{fill:rgba(255,255,255,.12);stroke:rgba(255,255,255,.5);stroke-width:2;transition:all .4s}
.lpd .nd text{fill:#fff;font-size:19px;font-weight:700;font-family:inherit}
.lpd .nd.on circle{fill:#fff;stroke:#fff}
.lpd .nd.on text{fill:var(--p)}
.lpd .ring{animation:spin 18s linear infinite;transform-origin:210px 210px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

  <div id="top">

    </div>
  </div>
  <div id="banner"><span class="bk">Phase 1 · Stabilise</span><span class="bt">From waiting to be asked <em>→</em> going out to look</span></div>
</div>

function setPhase(n){if(STATE.phaseShown===n)return;STATE.phaseShown=n;document.querySelectorAll('.ph').forEach(e=>{const p=+e.dataset.p;e.classList.toggle('on',n==='all'||p===n);});}
function setStage(name,sc){const order=['detect','prioritise','coordinate','verify'];document.querySelectorAll('.lp').forEach(e=>{const s=e.dataset.s;e.classList.toggle('on',name==='all'?s!=='safety':s===name);});
  $('.lp.safety').classList.toggle('show',sc.stages.some(s=>s[1]==='safety'));
  const used=sc.stages.map(s=>s[1]);const cur=used.indexOf(name);document.querySelectorAll('.lp').forEach(e=>{const i=used.indexOf(e.dataset.s);e.classList.toggle('done',i>=0&&i<cur);});}
function enterScene(i){
  i=clamp(i,0,SC.length-1);const prev=SC[STATE.idx],sc=SC[i];
  // cleanup
  OLS.forEach(o=>o.remove());TEMPS.forEach(m=>{scene.remove(m);if(m.geometry&&!Object.values(G).includes(m.geometry))m.geometry.dispose();});TEMPS.length=0;ARCS.length=0;RINGS.length=0;
  PEOPLE.forEach(p=>{p.reset();p.liftY=0;p.glowInt=1;p.tok=null;p.bag=null;});VIL.forEach(p=>p.mats.forEach(m=>m.clippingPlanes=[p.clip]));
  if(snapPts)snapPts.visible=false;resetPL();
  [...DP.querySelectorAll('.slot')].forEach(e=>e!==slotEl&&e.remove());
  const setChange=STATE.setName!==sc.set;
  STATE.idx=i;STATE.t=-(sc.pre||0);
  RT={cues:[],durs:[],fired:0};sc.given=false;
  sc.setup&&sc.setup();RT.cues.sort((a,b)=>a.t-b.t);
  setLight(sc.light,setChange);
  STATE.camFrom={p:camera.position.clone(),t:curTarget.clone()};STATE.blend=setChange||STATE.first?0:1.9;STATE.first=false;
  if(setChange&&STATE.setName){fadeEl.style.transition='none';fadeEl.style.opacity=1;void fadeEl.offsetWidth;fadeEl.style.transition='opacity .6s ease';fadeEl.style.opacity=0;}
  STATE.setName=sc.set;
  capEl.textContent=sc.caption;capEl.classList.toggle('hide',!sc.caption);fitCaption();
  tagEl.innerHTML=`<b>${String(i+1).padStart(2,'0')}</b><span>${sc.title}</span>`;
  counterEl.textContent=`${i+1} / ${SC.length}`;skipEl.value=i;
  STATE.prevPhase=prev?prev.phase:0;
  bannerEl.classList.remove('on');
  if(sc.pre&&!sc.banner){}
}
function fitCaption(){let f=26;capEl.style.fontSize=f+'px';while(capEl.scrollWidth>capEl.clientWidth+1&&f>19){f-=.5;capEl.style.fontSize=f+'px';}}
function sceneCam(sc,t){return sc.cam?sc.cam(Math.max(0,t)):{p:camera.position.clone(),t:curTarget.clone()};}
function step(dt){
  const sc=SC[STATE.idx];
  if(STATE.playing)STATE.t+=dt;else dt=0;
  STATE.T+=dt;const T=STATE.T,t=STATE.t;
  if(STATE.playing&&t>=sc.dur){if(STATE.idx<SC.length-1){enterScene(STATE.idx+1);return step(0);}else{STATE.t=sc.dur;STATE.playing=false;updPlay();}}
  const local=Math.max(0,STATE.t);
  // phase & banner
  if(sc.pre&&STATE.t<-sc.pre+.6)setPhase(STATE.prevPhase);else setPhase(sc.phase);
  bannerEl.classList.toggle('on',!!(sc.banner&&STATE.t<-.2));
  // stage
  let st=sc.stages.length?sc.stages[0][1]:null;for(const s of sc.stages)if(local>=s[0])st=s[1];setStage(st,sc);
  // cues
  if(STATE.t>=0){while(RT.fired<RT.cues.length&&RT.cues[RT.fired].t<=local)RT.cues[RT.fired++].fn();
    for(const d of RT.durs){if(d.done||local<d.t0)continue;const p=clamp((local-d.t0)/(d.t1-d.t0));d.fn(p);if(p>=1)d.done=true;}}
  sc.update&&sc.update(local,dt,T);
  PEOPLE.forEach(p=>p.update(dt,T));ARCS.forEach(a=>a.tick(T));RINGS.forEach(r=>r.tick(T));
  // camera
  const want=sceneCam(sc,STATE.t);const elapsed=STATE.t+(sc.pre||0);
  const c=STATE.blend>0?blendCam(STATE.camFrom,want,ease(clamp(elapsed/STATE.blend))):want;
  camera.position.copy(c.p);curTarget.copy(c.t);camera.lookAt(curTarget);
  SPLIT=!!(sc.split&&sc.split(local));
  if(SPLIT){const b=sc.camB(local);camB.position.copy(b.p);camB.lookAt(b.t);}
  splitEl.classList.toggle('on',SPLIT);
  progEl.style.width=(clamp((STATE.t+(sc.pre||0))/(sc.dur+(sc.pre||0)))*100)+'%';
  // light
  stepLight(Math.max(dt,1/120));
  const focus=SPLIT?camera.position.clone().lerp(curTarget,.7):curTarget;
  sun.target.position.copy(focus);sun.position.copy(focus).addScaledVector(LCUR.dir,90);
  sky.position.copy(camera.position);
}
function render(){
  if(SPLIT){camera.aspect=(W/2)/H;camera.updateProjectionMatrix();renderer.setScissorTest(true);
    renderer.setViewport(0,0,W/2,H);renderer.setScissor(0,0,W/2,H);renderer.render(scene,camera);
    const sp=sky.position.clone();sky.position.copy(camB.position);renderer.setViewport(W/2,0,W/2,H);renderer.setScissor(W/2,0,W/2,H);renderer.render(scene,camB);sky.position.copy(sp);
    renderer.setScissorTest(false);}
  else{if(camera.aspect!==W/H){camera.aspect=W/H;camera.updateProjectionMatrix();}renderer.setViewport(0,0,W,H);renderer.render(scene,camera);}
  updateOverlay();
}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;step(dt);render();requestAnimationFrame(loop);}

/* controls */
const bPlay=$('#bPlay');
function updPlay(){bPlay.innerHTML=STATE.playing?'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>Pause':'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>Play';stage.classList.toggle('paused',!STATE.playing);}
function togglePlay(){if(!STATE.playing&&STATE.idx===SC.length-1&&STATE.t>=SC[STATE.idx].dur){enterScene(0);}STATE.playing=!STATE.playing;updPlay();}
function go(i){enterScene(i);}
$('#bPrev').onclick=()=>go(STATE.idx-1);$('#bNext').onclick=()=>go(STATE.idx+1);bPlay.onclick=togglePlay;
$('#bRestart').onclick=()=>{enterScene(0);STATE.playing=true;updPlay();};
skipEl.onchange=()=>{go(+skipEl.value);skipEl.blur();};
addEventListener('keydown',e=>{if(e.target===skipEl)return;if(e.key==='ArrowRight'){go(STATE.idx+1);e.preventDefault();}else if(e.key==='ArrowLeft'){go(STATE.idx-1);e.preventDefault();}
  else if(e.key===' '){togglePlay();e.preventDefault();}else if(e.key==='r'||e.key==='R'){$('#bRestart').click();}else if(e.key==='h'||e.key==='H'){$('#ctl').classList.toggle('hidden');}});
addEventListener('resize',fit);

/* boot (supports #s=5&t=7.5&p=0 for rehearsal / testing) */
fit();STATE.first=true;
const hp=new URLSearchParams(location.hash.slice(1));
const startS=hp.has('s')?(+hp.get('s')-1):0;
enterScene(startS);
if(hp.has('t')){const tt=+hp.get('t');const n=Math.round((tt+(SC[startS].pre||0))*30);for(let i=0;i<n;i++)step(1/30);}
if(hp.get('p')==='0'){STATE.playing=false;}
updPlay();
window.__vg={STATE,SC,enterScene,step};
requestAnimationFrame(t=>{last=t;loop(t);});
</script>
</body>
